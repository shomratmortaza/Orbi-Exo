<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ORBI — One Ecosystem. Every Device.</title>
<meta name="theme-color" content="#0b0d14">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ORBI">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='5' fill='%230b0d14'/%3E%3Crect x='3' y='5' width='10' height='7' fill='%23f0a45d'/%3E%3Crect x='3' y='3' width='2' height='2' fill='%23f0a45d'/%3E%3Crect x='11' y='3' width='2' height='2' fill='%23f0a45d'/%3E%3Crect x='5' y='7' width='1' height='2' fill='%23111'/%3E%3Crect x='10' y='7' width='1' height='2' fill='%23111'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--acc:#7cf0c9;--blur:24px;--op:.45;--rad:28px;--d:.5s;--g:16,18,26;--t:#f3f5fa;--m:#a3a9ba;--ln:rgba(255,255,255,.14);--bg:#0b0d14}
[data-theme=light]{--g:255,255,255;--t:#161923;--m:#5a6072;--ln:rgba(0,0,0,.12);--bg:#e9edf5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:15px/1.45 "DM Sans",system-ui,sans-serif;color:var(--t);background:var(--bg);overflow-x:hidden}
.wall{position:fixed;inset:0;z-index:-1;background:radial-gradient(60vw 50vh at 15% 20%,#3b5bdb88,transparent),radial-gradient(50vw 50vh at 85% 30%,#e8672a77,transparent),radial-gradient(60vw 60vh at 50% 100%,#12b886aa,transparent),var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ln);background:rgba(128,128,140,.16);border-radius:10px;padding:6px 11px}
button:hover{background:rgba(128,128,140,.3)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input[type=text],input[type=number],textarea,select{background:rgba(128,128,140,.14);border:1px solid var(--ln);border-radius:10px;padding:7px 10px;width:100%}
input[type=range]{width:100%;accent-color:var(--acc)}
.isl{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:20;width:var(--w,170px);max-width:calc(100vw - 16px);border-radius:min(var(--rad),22px);background:rgba(var(--g),var(--op));backdrop-filter:blur(var(--blur)) saturate(1.7);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.7);border:1px solid var(--ln);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),inset 0 -8px 18px rgba(255,255,255,.04),0 14px 40px rgba(0,0,0,.35);transition:width var(--d) cubic-bezier(.2,.9,.3,1.15),border-radius var(--d);overflow:hidden}
.isl.open{border-radius:var(--rad)}
.isl::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(160px 90px at var(--mx,30%) var(--my,0),rgba(255,255,255,.22),transparent)}
.isl:not(.open):hover{--w:calc(var(--rw) + 28px)!important}
.bar{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;cursor:pointer;position:relative}
#pc{image-rendering:pixelated;flex:none}
#act{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
#act small{color:var(--m)}
.pbar{height:3px;background:rgba(128,128,140,.3);border-radius:3px;margin-top:3px}.pbar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.pw{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--d) cubic-bezier(.2,.9,.3,1.1)}
.open .pw{grid-template-rows:1fr}
.pi{min-height:0;overflow:hidden}
.pin{height:min(60vh,400px);display:flex;flex-direction:column;padding:0 14px 14px;position:relative}
nav{display:flex;gap:4px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
nav button{border:0;background:none;color:var(--m);white-space:nowrap}
nav button[aria-selected=true]{background:rgba(128,128,140,.25);color:var(--t)}
#view{flex:1;overflow:auto;min-height:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{border:1px solid var(--ln);border-radius:16px;padding:12px;background:rgba(128,128,140,.1)}
.card h3{margin:0 0 6px;font-size:13px;font-weight:500;color:var(--m)}
.big{font:500 30px "Unbounded",sans-serif}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}.row>*{flex:0 1 auto}
.li{display:flex;gap:8px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--ln)}
.li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li.pin span{color:var(--acc)}
.mut{color:var(--m);font-size:13px}
.drop{border:2px dashed var(--ln);border-radius:16px;padding:22px;text-align:center}.drop.on{border-color:var(--acc)}
.pri{background:var(--acc);color:#0b0d14;border-color:transparent;font-weight:700}
.lrc{font:500 18px "Unbounded";min-height:28px;text-align:center;margin:8px 0}
canvas.v{width:100%;height:50px;display:block}
.desk{max-width:560px;margin:22vh auto 0;padding:0 20px}
.desk h1{font:700 clamp(34px,8vw,60px)/1 "Unbounded";margin:0 0 10px;letter-spacing:-.03em}
.desk p{color:var(--m);max-width:46ch}
.bt{display:inline-block;text-decoration:none;color:inherit;border:1px solid var(--ln);background:rgba(128,128,140,.16);border-radius:10px;padding:8px 14px}.bt:hover{background:rgba(128,128,140,.3)}.bt.pri{background:var(--acc);color:#0b0d14;border-color:transparent;font-weight:700}
.desk .card{background:rgba(var(--g),.4);backdrop-filter:blur(14px)}
#launch{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.4);display:none;padding-top:20vh}
#launch.on{display:block}
#launch .b{max-width:520px;margin:auto;padding:12px;border-radius:20px;background:rgba(var(--g),.8);backdrop-filter:blur(var(--blur));border:1px solid var(--ln)}
#lr button{display:block;width:100%;text-align:left;border:0;background:none}#lr button.s{background:rgba(128,128,140,.3)}
@media (prefers-reduced-motion:reduce){:root{--d:.01s}}
.rm{--d:.01s}
html.desktop,html.desktop body{background:transparent}.desktop .wall,.desktop .desk{display:none}.desktop #launch{background:transparent}.desktop .isl{background:rgba(var(--g),max(var(--op),.72))}
.isl.ai{animation:glow 1.6s ease-in-out infinite}@keyframes glow{50%{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 0 30px var(--acc),0 14px 40px rgba(0,0,0,.35)}}
@media (prefers-reduced-motion:reduce){.isl.ai{animation:none}}
.un{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}
</style>
</head>
<body>
<div class="wall"></div>

<div class="isl" id="isl">
  <div class="bar" id="bar" tabindex="0" role="button" aria-expanded="false" aria-label="ORBI island. Press Enter to expand">
    <canvas id="pc" aria-hidden="true"></canvas><div id="act"></div><canvas id="vz" width="40" height="16" aria-hidden="true"></canvas>
  </div>
  <div class="pw"><div class="pi"><div class="pin">
    <nav id="tabs" role="tablist" aria-label="ORBI modules"></nav>
    <div id="view" role="tabpanel"></div>
  </div></div></div>
</div>

<main class="desk" id="desk">
  <h1>ORBI</h1>
  <p>One Ecosystem. Every Device. Your island is at the top of this page. Tap it to open music, clipboard, shelf, widgets, notes and your pixel pet.</p>
  <div class="card">
    <h3>Set up your ORBI</h3>
    <div id="setup" class="mut" style="margin-bottom:8px"></div>
    <div class="row"><input type="text" id="un" placeholder="Your name (shown next to your pet)" maxlength="16" style="flex:1" aria-label="Your name"></div>
    <div class="row" id="ob-pets"></div>
    <div class="row">
      <button data-a="theme">Switch light / dark</button>
      <button data-a="notif">Allow notifications</button>
      <button id="inst" data-a="install" hidden>Install ORBI</button>
      <button data-a="hide">Done</button>
    </div>
    <p class="mut">Search everything with <b>Ctrl/⌘ + K</b>. Everything is stored on this device only.</p>
  </div>
</main>

<div id="launch" role="dialog" aria-label="ORBI launcher"><div class="b"><input type="text" id="lq" placeholder="Search, or type “timer 10”, a website, a note…" aria-label="Search ORBI"><div id="lr"></div></div></div>
<input type="file" id="fm" accept="audio/*" multiple hidden>
<input type="file" id="fl" accept=".lrc,text/plain" hidden>
<input type="file" id="fi" multiple hidden>
<input type="file" id="fs" accept="application/json" hidden>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={g:(k,d)=>{try{return JSON.parse(localStorage.getItem('orbi.'+k))??d}catch{return d}},s:(k,v)=>{try{localStorage.setItem('orbi.'+k,JSON.stringify(v))}catch{}}};
const DEF={theme:'dark',acc:'#7cf0c9',w:170,blur:24,op:.45,rad:28,spd:1,pet:'cat',name:'Mochi',user:'',showUser:true,petOn:true,ps:3,rm:matchMedia('(prefers-reduced-motion:reduce)').matches,react:true,hover:true};
let S={...DEF,...LS.g('s',{})};
let alarms=LS.g('alarms',[]),events=LS.g('events',[]),calM=new Date(),notes=LS.g('notes',''),tasks=LS.g('tasks',[]),clips=LS.g('clips',[]),hist=LS.g('hist',[]),stats=LS.g('stats',{hap:70,en:80,fr:10,xp:0});
let paused=false,priv=false,shelf=[],q=[],qi=-1,T=null,SW={on:false,t0:0,acc:0},notif=null,open=false,tab='home',lastAct=Date.now(),mouse={x:0,y:0,t:0},wx=LS.g('wx',null);
const save=()=>LS.s('s',S);

/* ---------- Pixel pet ---------- */
const SP={cat:{b:'#f0a45d',d:'#c9772e',l:'#ffe3c2',ear:'pt'},dog:{b:'#c99a6b',d:'#7a4f2d',l:'#f5e1c8',ear:'flop'},bunny:{b:'#f4f0f5',d:'#e9a9c3',l:'#fff',ear:'long'},panda:{b:'#f7f7f7',d:'#232323',l:'#fff',ear:'round',patch:1,e:'#fff'},fox:{b:'#e8672a',d:'#7a2e10',l:'#fff1e0',ear:'pt'},bear:{b:'#8a5a3a',d:'#5a3820',l:'#d9b38c',ear:'round'},orbi:{b:'#7cf0c9',d:'#2aa88a',l:'#d9fff3',ear:'ant'}};
const pet={st:'idle',until:0,start:0,blinkAt:0,closed:0,look:[0,0],lookAt:0,bob:0,hop:0,tail:0,eye:'open',mouth:0};
const setSt=(s,ms=0)=>{pet.st=s;pet.start=performance.now();pet.until=ms?pet.start+ms:0};
function act(){lastAct=Date.now();if(pet.st==='sleep'){setSt('wake',700);}}
function drawPet(c,sc){const P=SP[S.pet]||SP.cat,x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);const r=(a,b,w,h,k)=>{x.fillStyle=k;x.fillRect(a*sc,b*sc,w*sc,h*sc)},y=pet.bob+pet.hop,b=S.pet==='orbi'?S.acc:P.b;
r(12+pet.tail,9+y,2,1,b);r(13+pet.tail,8+y,1,1,b);r(4,10+y,8,4,b);r(3,4+y,10,7,b);
if(P.ear==='pt'){r(3,2+y,2,2,b);r(11,2+y,2,2,b);r(4,3+y,1,1,P.d);r(11,3+y,1,1,P.d)}
else if(P.ear==='long'){r(4,0+y,2,4,b);r(10,0+y,2,4,b);r(5,1+y,1,2,P.d);r(10,1+y,1,2,P.d)}
else if(P.ear==='round'){r(3,2+y,2,2,P.d);r(11,2+y,2,2,P.d)}
else if(P.ear==='flop'){r(2,3+y,2,5,P.d);r(12,3+y,2,5,P.d)}
else{r(7,1+y,2,2,P.d);r(7,0+y,2,1,P.l)}
r(5,8+y,6,3,P.l);if(P.patch){r(4,5+y,3,3,P.d);r(9,5+y,3,3,P.d)}
const [lx,ly]=pet.look,ec=P.e||'#15171f',E=pet.eye;
[5,10].forEach(ex=>{if(E==='open'){r(ex,6+y,1,2,ec);r(ex+lx,6+y+ly,1,2,ec)}
else if(E==='closed'){r(ex-.0,7+y,2,1,ec)}
else if(E==='happy'){r(ex-1,7+y,1,1,ec);r(ex,6+y,1,1,ec);r(ex+1,7+y,1,1,ec)}
else{r(ex,5+y,2,3,ec);r(ex,5+y,1,1,'#fff')}});
r(7,8+y,2,1,'#ff8aa8');if(pet.mouth||E==='wide')r(7,9+y,2,1,'#5a1a1a');
if(E==='happy'){r(3,8+y,1,1,'#ff8aa8');r(12,8+y,1,1,'#ff8aa8')}
if(pet.st==='sleep'){r(12,1,2,1,'#fff');r(13,2,1,1,'#fff');r(12,3,2,1,'#fff')}}
function petTick(t){const rm=S.rm;
 if(pet.until&&t>pet.until){setSt('idle')}
 if(pet.st==='idle'&&Date.now()-lastAct>60000&&!playing())setSt('sleep');
 if(S.react&&playing()&&beat>0&&pet.st!=='dance'&&pet.st!=='eat')setSt('dance',900);
 const el=t-pet.start;pet.hop=0;pet.mouth=0;pet.tail=Math.sin(t/(pet.st==='dance'?90:350))>0?0:1;pet.bob=Math.sin(t/(pet.st==='sleep'?1100:650))>.5?1:0;pet.eye='open';
 if(rm){pet.bob=0;pet.tail=0}
 switch(pet.st){case'sleep':pet.eye='closed';break;
 case'dance':pet.eye='happy';if(!rm)pet.hop=-Math.round(Math.abs(Math.sin(t/150)));break;
 case'happy':pet.eye='happy';if(!rm)pet.hop=-Math.round(Math.abs(Math.sin(el/160))*2);break;
 case'eat':pet.eye='closed';pet.mouth=Math.floor(t/150)%2;break;
 case'surprised':case'wake':pet.eye='wide';pet.mouth=1;break;
 case'curious':pet.look=lookAtMouse();break;
 default:{if(t>pet.blinkAt){pet.closed=t+150;pet.blinkAt=t+2000+Math.random()*3500}
  if(t<pet.closed)pet.eye='closed';
  if(t-mouse.t<3000)pet.look=lookAtMouse();else if(t>pet.lookAt){pet.look=[[-1,0],[1,0],[0,-1],[0,1],[0,0],[0,0]][Math.floor(Math.random()*6)];pet.lookAt=t+1500+Math.random()*3000}}}
 if(pet.st==='wake'&&!pet.until)setSt('wake',700);
 const sc=6,a=$('#pc');drawPet(a,sc);const b=$('#pp');if(b)drawPet(b,sc)}
function lookAtMouse(){const r=$('#pc').getBoundingClientRect(),dx=mouse.x-(r.left+r.width/2),dy=mouse.y-(r.top+r.height/2);return[Math.abs(dx)>20?Math.sign(dx):0,Math.abs(dy)>30?Math.sign(dy):0]}
function sizePet(){const c=$('#pc');c.width=16*6;c.height=15*6;c.style.width=16*S.ps+'px';c.style.height=15*S.ps+'px';c.style.display=S.petOn?'':'none'}
let last=0;(function loop(t){requestAnimationFrame(loop);if(document.hidden||t-last<(S.rm?250:33))return;last=t;petTick(t);viz()})(0);

/* ---------- Audio ---------- */
const au=new Audio();let ac,an,fd,list=[],cur=-1,beat=0,avg=0,lrc=[];
const playing=()=>!au.paused&&!au.ended&&cur>=0;
function playIdx(i){if(!list[i])return;cur=i;au.src=list[i].url;lrc=[];if(!ac){ac=new AudioContext();an=ac.createAnalyser();an.fftSize=128;ac.createMediaElementSource(au).connect(an);an.connect(ac.destination);fd=new Uint8Array(an.frequencyBinCount)}ac.resume();au.play();media();if(tab==='music')show('music');act()}
function media(){if(!('mediaSession' in navigator)||cur<0)return;navigator.mediaSession.metadata=new MediaMetadata({title:list[cur].name,artist:'ORBI'});[['play',()=>au.play()],['pause',()=>au.pause()],['nexttrack',()=>playIdx((cur+1)%list.length)],['previoustrack',()=>playIdx((cur-1+list.length)%list.length)]].forEach(([a,f])=>{try{navigator.mediaSession.setActionHandler(a,f)}catch{}})}
au.onended=()=>{if(list.length>1)playIdx((cur+1)%list.length)};
function viz(){const cs=[$('#vz'),$('#mv')].filter(Boolean);beat=0;let bars=null;
 if(playing()&&an){an.getByteFrequencyData(fd);bars=fd;const bass=(fd[1]+fd[2]+fd[3]+fd[4])/4;avg=avg*.95+bass*.05;if(bass>avg*1.2&&bass>110)beat=bass}
 cs.forEach(c=>{const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);if(!bars)return;const n=c.id==='vz'?6:32,w=c.width/n;x.fillStyle=S.acc;for(let i=0;i<n;i++){const h=Math.max(2,bars[i+1]/255*c.height);x.fillRect(i*w+1,c.height-h,w-2,h)}})}

/* ---------- Island state ---------- */
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function notify(title,body=''){hist.unshift({title,body,ts:Date.now()});hist=hist.slice(0,40);LS.s('hist',hist);notif={title,body,until:Date.now()+4500};setSt('surprised',900);
 if('Notification'in window&&Notification.permission==='granted'){try{new Notification(title,{body})}catch{}}if(tab==='home')show('home')}
function island(){const a=$('#act'),i=$('#isl');let w=S.w,h='';
 const now=Date.now();
 if(notif&&now<notif.until){w=Math.max(S.w,320);h=`<b>${esc(notif.title)}</b> <small>${esc(notif.body)}</small>`}
 else if(T){const rem=(T.end-now)/1000,p=1-rem/T.total;w=Math.max(S.w,260);h=`<b>${T.label}</b> ${fmt(rem)}<div class="pbar"><i style="width:${Math.min(100,p*100)}%"></i></div>`;if(rem<=0){notify(T.label+' finished','Time is up.');T=null;setSt('happy',1500)}}
 else if(aiBusy){w=Math.max(S.w,240);h='✦ <b>AI</b> <small>thinking…</small>'}
 else if(playing()){w=Math.max(S.w,280);h=`♪ ${esc(list[cur].name)}`}
 else if(S.user&&S.showUser){w=Math.max(S.w,Math.min(300,96+S.user.length*9));h=`<b class="un">${esc(S.user)}</b>`}
 if(open){i.style.setProperty('--w',Math.min(620,innerWidth-16)+'px')}else{i.style.setProperty('--w',w+'px')}
 i.style.setProperty('--rw',w+'px');i.classList.toggle('ai',aiBusy);a.innerHTML=open?'<b>ORBI</b>':(h||(S.petOn?'':'<b>ORBI</b>'));$('#vz').style.display=!open&&playing()?'':'none'}
function setOpen(v){open=v;$('#isl').classList.toggle('open',v);$('#bar').setAttribute('aria-expanded',v);if(v){show(tab);act();if(S.hover)setSt('curious',1800)}island()}
$('#bar').onclick=()=>{setOpen(!open);if(!open)return};
$('#bar').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();setOpen(!open)}};
document.addEventListener('pointerdown',e=>{act();if(open&&!e.target.closest('#isl')&&!e.target.closest('#launch'))setOpen(false)});
$('#isl').addEventListener('pointermove',e=>{const r=e.currentTarget.getBoundingClientRect();e.currentTarget.style.setProperty('--mx',e.clientX-r.left+'px');e.currentTarget.style.setProperty('--my',e.clientY-r.top+'px')});
addEventListener('pointermove',e=>{mouse={x:e.clientX,y:e.clientY,t:performance.now()};if(pet.st==='sleep')act()});
$('#pc').addEventListener('click',e=>{if(!open){e.stopPropagation();setSt('happy',1200);bump('hap',3)}});

/* ---------- Tabs & views ---------- */
const TABS=[['home','Home'],['music','Music'],['clips','Clipboard'],['shelf','Shelf'],['notes','Notes & tasks'],['alarms','Alarms'],['cal','Calendar'],['pet','Pet'],['settings','Settings']];
$('#tabs').innerHTML=TABS.map(([k,n])=>`<button role="tab" data-a="tab" data-v="${k}">${n}</button>`).join('');
function show(k){tab=k;document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===k));$('#view').innerHTML=V[k]();if(k==='music')lyr();}
const bump=(k,n)=>{stats[k]=Math.max(0,Math.min(100,stats[k]+n));stats.xp+=Math.abs(n);LS.s('stats',stats);if(tab==='pet')show('pet')};
const wmo=c=>c===0?'Clear':c<4?'Partly cloudy':c<50?'Fog':c<70?'Rain':c<80?'Snow':c<95?'Showers':'Thunderstorm';
const V={
home(){const nav=navigator,c=nav.connection;return`<div class="grid">
<div class="card"><h3>Clock</h3><div class="big" id="ck"></div><div class="mut" id="dt"></div></div>

const LN=()=>window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
async function syncNative(){const ln=LN();if(!ln)return;try{
 const pr=await ln.requestPermissions();if(pr.display!=='granted'){notify('Notifications blocked','Allow notifications for ORBI in Android settings so alarms can ring.');return}
 const pend=await ln.getPending();if(pend.notifications.length)await ln.cancel({notifications:pend.notifications});
 const list=[],now=Date.now();
 alarms.filter(a=>a.on).forEach((a,i)=>{const[h,m]=a.t.split(':').map(Number);list.push({id:1000+i,title:'⏰ '+(a.l||'Alarm'),body:a.t,schedule:{on:{hour:h,minute:m},allowWhileIdle:true}})});
 events.filter(e=>e.t).forEach((e,i)=>{const at=new Date(e.d+'T'+e.t+':00');if(at.getTime()>now)list.push({id:5000+i,title:'📅 '+e.l,body:e.t,schedule:{at,allowWhileIdle:true}})});
 if(list.length)await ln.schedule({notifications:list})}catch(err){notify('Could not schedule alarms',String(err.message||err).slice(0,80))}}
['aladd','alon','aldel','evadd','evdel'].forEach(k=>{const f=A[k];A[k]=function(){const r=f.apply(this,arguments);syncNative();return r}});
addEventListener('load',()=>setTimeout(syncNative,1500));
function beep(){try{const c=new AudioContext();[0,.35,.7,1.05].forEach(o=>{const g=c.createGain(),x=c.createOscillator();x.frequency.value=880;x.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.2,c.currentTime+o);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+o+.3);x.start(c.currentTime+o);x.stop(c.currentTime+o+.3)})}catch{}}

 alarms.forEach(a=>{if(a.on&&a.t===hm&&a.f!==day+hm){a.f=day+hm;LS.s('alarms',alarms);beep();setSt('surprised',3000);notify('⏰ '+(a.l||'Alarm'),a.t)}});
