name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:   # manual test build (no public release, artifacts only)

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults: {run: {working-directory: desktop}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: npm install
      - run: npm run dist
      - name: Verify installer
        shell: pwsh
        run: |
          if (-not (Test-Path dist/ORBI-Setup-x64.exe)) { Write-Error "Installer missing"; exit 1 }
          Get-Item dist/ORBI-Setup-x64.exe | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with: {name: windows, path: desktop/dist/ORBI-Setup-x64.exe, if-no-files-found: error}

  android:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: android-app}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - name: App icon
        run: |
          for d in android/app/src/main/res/mipmap-*; do
            case "$d" in *anydpi*) rm -rf "$d";; *) cp ../icons/icon-192.png "$d/ic_launcher.png"; cp ../icons/icon-192.png "$d/ic_launcher_round.png"; rm -f "$d/ic_launcher_foreground.png";; esac
          done
      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          if [ -z "$KS_B64" ]; then
            echo "::warning::No signing secrets set. Using the temporary debug key (fine for testing, NOT for public releases)."
            ./android/gradlew -p android assembleDebug
            cp android/app/build/outputs/apk/debug/app-debug.apk ORBI.apk
          else
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/orbi.jks"
            $BT/zipalign -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
            $BT/apksigner sign --ks "$RUNNER_TEMP/orbi.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KS_PASS --out ORBI.apk "$RUNNER_TEMP/aligned.apk"
            $BT/apksigner verify ORBI.apk
            rm -f "$RUNNER_TEMP/orbi.jks"
          fi
          ls -l ORBI.apk
      - uses: actions/upload-artifact@v4
        with: {name: android, path: android-app/ORBI.apk, if-no-files-found: error}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: out, merge-multiple: true}
      - name: Checksums and release
        env: {GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
        run: |
          cd out && ls -l
          sha256sum ORBI-Setup-x64.exe ORBI.apk > SHA256SUMS.txt
          { echo "## What's new in ${GITHUB_REF_NAME}"; echo "- See commit history for details."; echo; echo "SHA-256"; echo '```'; cat SHA256SUMS.txt; echo '```'; } > notes.md
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ORBI-Setup-x64.exe ORBI.apk SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "ORBI $GITHUB_REF_NAME" --notes-file notes.md --draft=false --latest
          else
            gh release create "$GITHUB_REF_NAME" ORBI-Setup-x64.exe ORBI.apk SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --title "ORBI $GITHUB_REF_NAME" --notes-file notes.md --latest
          fi
